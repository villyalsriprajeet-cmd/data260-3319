<!-- Login page-->
{% extends "base.html" %}
{% block title %}Login - Sports League Fixtures{% endblock %}
{% block nav_login %}active{% endblock %}
{% block content %}
  <div class="row justify-content-center">
    <div class="col-md-5">
      <div class="card shadow-sm">
        <div class="card-body">
          <h4 class="card-title mb-3">Login</h4>
          <!-- shown only when theres a failed login) -->
          {% if error %}
          <div class="alert alert-danger" role="alert">
            Invalid username or password. Please try again.
          </div>
          {% endif %}
          <!-- posts username and password to /login -->
          <form method="post" action="/login">
            <div class="mb-3">
              <label class="form-label">Username</label>
              <input class="form-control" type="text" name="username" required autofocus>
            </div>
            <div class="mb-3">
              <label class="form-label">Password</label>
              <input class="form-control" type="password" name="password" required>
            </div>
            <button class="btn btn-primary w-100" type="submit">Login</button>
          </form>
          <div class="text-center mt-3">
            <a href="/">Back to Home</a>
          </div>
        </div>
      </div>
    </div>
  </div>
{% endblock %}
