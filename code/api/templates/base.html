<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}Community Sports League Fixtures{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="/">&#9917; Sports League Fixtures</a>
      <div class="navbar-nav ms-auto">
        <a class="nav-link {% block nav_home %}{% endblock %}" href="/">Home</a>
        {% if user %}
          <a class="nav-link {% block nav_dashboard %}{% endblock %}" href="/dashboard">Dashboard</a>
          <a class="nav-link" href="/logout">Logout</a>
        {% else %}
          <a class="nav-link {% block nav_login %}{% endblock %}" href="/login">Login</a>
        {% endif %}
      </div>
    </div>
  </nav>
  <div class="container my-4">
    {% block content %}{% endblock %}
  </div>
</body>
</html>
