# HW8 Part 1: Kafka, the fixture worker and the FastAPI service
services:
  kafka:
    image: apache/kafka:3.9.2
    container_name: s3319_kafka
    hostname: kafka
    ports:
      - "9092:9092" 
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"  # topics are created by hand
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:19092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 10s

  kafka-init:  # creates the two Part 1 topics and exits
    image: apache/kafka:3.9.2
    container_name: s3319_kafka_init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        /opt/kafka/bin/kafka-topics.sh --create --if-not-exists --topic s3319_fixture_requests --partitions 1 --replication-factor 1 --bootstrap-server kafka:19092
        /opt/kafka/bin/kafka-topics.sh --create --if-not-exists --topic s3319_fixture_responses --partitions 1 --replication-factor 1 --bootstrap-server kafka:19092
        echo "Part 1 topics ready"

  worker:
    build: ./code/kafka_service
    container_name: s3319_worker
    command: ["python", "worker.py"]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    restart: unless-stopped

  api:
    build: ./code/kafka_service
    container_name: s3319_api
    command: ["uvicorn", "api:APP", "--host", "0.0.0.0", "--port", "8619"]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
    ports:
      - "127.0.0.1:8619:8619"
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      worker:
        condition: service_started
    restart: unless-stopped
