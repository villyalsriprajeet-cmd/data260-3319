# HW7 Part 1: Ruff linter and formatter settings (used by the pre commit hook and `ruff check`)
[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["code/frontend", "reports", "data", "__pycache__"]
[tool.ruff.lint]
select = ["E", "F", "I"]  # pycodestyle errors, pyflakes (unused imports/variables), import sorting
[tool.ruff.format]
quote-style = "double"
indent-style = "space"
[tool.ruff.lint.per-file-ignores]
"code/hw7_*.py" = ["E402"]  # HW7 scripts import after adding the HW1/HW5 folders to sys.path
"code/homework_demo.py" = ["E402"]  # HW8: imports come after the sys.path line
"code/verify_hw08.py" = ["E402"]
"code/kafka_agents/*.py" = ["E402"]
